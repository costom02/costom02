name: RDP + RustDesk

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. Configure Windows RDP
      # =========================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableClip" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force


      # =========================================================
      # 2. Create RDP User
      # =========================================================
      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]]"!@#%^&*-_+="
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          "::add-mask::$password"

          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "User creation failed"
            exit 1
          }


      # =========================================================
      # 3. Install Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force


      # =========================================================
      # 4. Connect Tailscale
      # =========================================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

            Start-Sleep -Seconds 5
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned."
            exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"


      # =========================================================
      # 5. Verify RDP
      # =========================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Testing RDP on $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP failed."
            exit 1
          }

          Write-Host "RDP TCP connectivity successful!"


      # =========================================================
      # 6. Install RustDesk
      # =========================================================
      - name: Install RustDesk
        shell: powershell
        run: |

          Write-Host "Finding latest RustDesk Windows release..."

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" `
            -Headers @{
              "User-Agent" = "GitHub-Actions"
            }

          $asset = $release.assets |
            Where-Object {
              $_.name -match "x86_64\.exe$"
            } |
            Select-Object -First 1

          if (-not $asset) {
            Write-Error "Could not find RustDesk Windows x86_64 installer."
            exit 1
          }

          Write-Host "RustDesk version: $($release.tag_name)"
          Write-Host "Downloading: $($asset.name)"

          $installer = "$env:TEMP\rustdesk.exe"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $installer

          Write-Host "Installing RustDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--silent-install" `
            -Wait

          Start-Sleep -Seconds 15

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          if (-not (Test-Path $rustdesk)) {
            Write-Error "RustDesk installation failed."
            exit 1
          }

          Write-Host "RustDesk installed successfully."


      # =========================================================
      # 7. Install and Start RustDesk Service
      # =========================================================
      - name: Configure RustDesk Service
        shell: powershell
        run: |

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Write-Host "Installing RustDesk service..."

          & $rustdesk --install-service

          Start-Sleep -Seconds 15

          $service = Get-Service `
            -Name "RustDesk" `
            -ErrorAction SilentlyContinue

          if (-not $service) {
            Write-Error "RustDesk service was not installed."
            exit 1
          }

          if ($service.Status -ne "Running") {
            Start-Service -Name "RustDesk"
            Start-Sleep -Seconds 10
          }

          Write-Host "RustDesk service is running."


      # =========================================================
      # 8. Create RustDesk Password
      # =========================================================
      - name: Configure RustDesk Password
        shell: powershell
        run: |

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          $chars = (
            65..90 +
            97..122 +
            48..57
          )

          $rdPassword = -join (
            $chars |
            Get-Random -Count 16 |
            ForEach-Object {
              [char]$_
            }
          )

          & $rustdesk --password $rdPassword

          echo "RUSTDESK_PASSWORD=$rdPassword" >> $env:GITHUB_ENV

          "::add-mask::$rdPassword"

          Write-Host "RustDesk permanent password configured."


      # =========================================================
      # 9. Get RustDesk ID
      # =========================================================
      - name: Get RustDesk ID
        shell: powershell
        run: |

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Start-Sleep -Seconds 10

          $rdID = (& $rustdesk --get-id).Trim()

          if (-not $rdID) {
            Write-Error "Could not obtain RustDesk ID."
            exit 1
          }

          echo "RUSTDESK_ID=$rdID" >> $env:GITHUB_ENV

          Write-Host "RustDesk ID: $rdID"


      # =========================================================
      # 10. Display Connection Information
      # =========================================================
      - name: Display Connection Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          RDP + RUSTDESK ACCESS"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "RDP"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "RUSTDESK"
          Write-Host "ID:       $env:RUSTDESK_ID"
          Write-Host "Password: $env:RUSTDESK_PASSWORD"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""


      # =========================================================
      # 11. Keep GitHub VM Running
      # =========================================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP + RUSTDESK ARE ACTIVE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RustDesk ID:  $env:RUSTDESK_ID"
          Write-Host ""
          Write-Host "Use your RDP app OR RustDesk Android app."
          Write-Host ""

          while ($true) {

            Write-Host "[$(Get-Date)] RDP + RustDesk Active"

            Start-Sleep -Seconds 300
          }
