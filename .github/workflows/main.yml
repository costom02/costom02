name: RDP + RustDesk

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. CONFIGURE WINDOWS RDP
      # =========================================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "Configuring Windows Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableClip" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10 `
            profile=any

          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration complete."


      # =========================================================
      # 2. CREATE RDP USER
      # =========================================================
      - name: Create RDP User
        shell: powershell
        run: |
          Write-Host "Creating RDP user..."

          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]]"!@#%^&*-_+="
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created."
          Write-Host "RDP Username: RDP"
          Write-Host "RDP Password: $password"


      # =========================================================
      # 3. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Installing Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

          Write-Host "Tailscale installed."


      # =========================================================
      # 4. CONNECT TO TAILSCALE
      # =========================================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          Write-Host "Connecting to Tailscale..."

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim()

            if ($tsIP) {
              break
            }

            Write-Host "Waiting for Tailscale IP..."
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP was not assigned."
            exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "================================"
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "================================"


      # =========================================================
      # 5. TEST RDP
      # =========================================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Testing RDP..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "RDP TCP connection failed."
            exit 1
          }

          Write-Host "RDP TCP connectivity successful!"


      # =========================================================
      # 6. DOWNLOAD RUSTDESK MSI
      # =========================================================
      - name: Download RustDesk MSI
        shell: powershell
        run: |
          Write-Host "Finding latest RustDesk release..."

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" `
            -Headers @{"User-Agent"="GitHub-Actions"}

          Write-Host "RustDesk version: $($release.tag_name)"

          $asset = $release.assets |
            Where-Object {
              $_.name -match "x86_64.*\.msi$"
            } |
            Select-Object -First 1

          if (-not $asset) {
            Write-Error "Could not find RustDesk x86_64 MSI."
            exit 1
          }

          Write-Host "Downloading: $($asset.name)"

          $rustdeskInstaller = "$env:TEMP\rustdesk.msi"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $rustdeskInstaller

          if (-not (Test-Path $rustdeskInstaller)) {
            Write-Error "RustDesk MSI download failed."
            exit 1
          }

          Write-Host "RustDesk MSI downloaded successfully."


      # =========================================================
      # 7. INSTALL RUSTDESK USING MSI
      # =========================================================
      - name: Install RustDesk
        shell: powershell
        run: |
          Write-Host "Installing RustDesk using MSI..."

          $installer = "$env:TEMP\rustdesk.msi"

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$installer`"", "/qn", "/norestart", "INSTALLPRINTER=N" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            Write-Error "RustDesk MSI installation failed."
            exit 1
          }

          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          for ($i = 1; $i -le 30; $i++) {

            if (Test-Path $rustdesk) {
              Write-Host "RustDesk installation detected."
              break
            }

            Write-Host "Waiting for RustDesk installation..."
            Start-Sleep -Seconds 5
          }

          if (-not (Test-Path $rustdesk)) {
            Write-Error "RustDesk executable was not found."
            exit 1
          }

          Write-Host "================================"
          Write-Host "RustDesk installed successfully!"
          Write-Host "================================"


      # =========================================================
      # 8. INSTALL RUSTDESK SERVICE
      # =========================================================
      - name: Configure RustDesk Service
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Write-Host "Installing RustDesk service..."

          Start-Process `
            -FilePath $rustdesk `
            -ArgumentList "--install-service" `
            -Wait

          Start-Sleep -Seconds 20

          $service = Get-Service `
            -Name "RustDesk" `
            -ErrorAction SilentlyContinue

          if (-not $service) {
            Write-Error "RustDesk service was not installed."
            exit 1
          }

          if ($service.Status -ne "Running") {
            Start-Service -Name "RustDesk"
            Start-Sleep -Seconds 10
          }

          $service.Refresh()

          if ($service.Status -ne "Running") {
            Write-Error "RustDesk service is not running."
            exit 1
          }

          Write-Host "RustDesk service is running."


      # =========================================================
      # 9. CREATE RUSTDESK PASSWORD
      # =========================================================
      - name: Configure RustDesk Password
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          $chars = (
            65..90 +
            97..122 +
            48..57
          )

          $rdPassword = -join (
            $chars |
            Get-Random -Count 16 |
            ForEach-Object {
              [char]$_
            }
          )

          Write-Host "Setting RustDesk permanent password..."

          Start-Process `
            -FilePath $rustdesk `
            -ArgumentList "--password", $rdPassword `
            -Wait

          Start-Sleep -Seconds 5

          echo "RUSTDESK_PASSWORD=$rdPassword" >> $env:GITHUB_ENV

          Write-Host "RustDesk Password: $rdPassword"


      # =========================================================
      # 10. GET RUSTDESK ID
      # =========================================================
      - name: Get RustDesk ID
        shell: powershell
        run: |
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"

          Write-Host "Getting RustDesk ID..."

          Start-Sleep -Seconds 10

          $rdID = (
            & $rustdesk --get-id |
            Out-String
          ).Trim()

          if (-not $
